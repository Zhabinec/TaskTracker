name: tasktracker
services:
  db:
    image: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasktracker}
      POSTGRES_USER: ${POSTGRES_USER:-tasktracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  migrate:
    build: ./backend
    command: ["python", "-m", "tasktracker.infrastructure.db.migrate"]
    environment: &database_environment
      TASKTRACKER_ENVIRONMENT: production
      TASKTRACKER_PRODUCT_TIMEZONE: Europe/Moscow
      TASKTRACKER_DB_HOST: db
      TASKTRACKER_DB_NAME: ${POSTGRES_DB:-tasktracker}
      TASKTRACKER_DB_USER: ${POSTGRES_USER:-tasktracker}
      TASKTRACKER_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    init: true
    security_opt: ["no-new-privileges:true"]
  api:
    build: ./backend
    environment: *database_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      FASTAPI_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres_data:
